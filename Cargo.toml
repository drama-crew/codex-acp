[package]
name = "codex-acp"
version = "0.16.0"
edition = "2024"
authors = ["Zed <hi@zed.dev>"]
license = "Apache-2.0"
description = "An ACP-compatible coding agent powered by Codex"
repository = "https://github.com/zed-industries/codex-acp"
homepage = "https://github.com/zed-industries/codex-acp"

[[bin]]
name = "codex-acp"
path = "src/main.rs"

[lib]
doctest = false
name = "codex_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.14.0", features = ["unstable"] }
anyhow = "1"
clap = "4"
codex-apply-patch = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-arg0 = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-config = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-core = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-exec-server = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-extension-api = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-features = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-home = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-http-client = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-mcp-server = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-memories-extension = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-memories-write = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-models-manager = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-login = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-shell-command = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-state = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-thread-store = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-utils-path-uri = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-utils-approval-presets = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-utils-cli = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
# Pin allocative to match starlark 0.14.2's `^0.3.6` requirement (bumped from
# 0.3.4 during the rust-v0.144.3 dep bump; starlark_map's hashbrown internals
# need allocative's matching hashbrown implementation).
allocative = "=0.3.6"
diffy = { version = "0.5.0", features = ["std"] }
itertools = "0.14.0"
serde = { version = "1", features = ["derive"] }
# codex-cli depends on codex-tui, which enables serde_json/preserve_order; match
# that behavior here because it affects MCP keychain account hashing.
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
heck = "0.5.0"
unicode-segmentation = "1.11.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."https://github.com/openai/codex"]
# drama: TEMPORARY local-worktree override (Task B5, 2026-07-24) — every codex-* crate below
# points at the local `codex` worktree (`./.worktrees/agent-memory/codex/codex-rs`, branch
# `drama/agent-memory-0.144`) instead of our usual pinned fork branch
# (drama-crew/codex @ drama/summary-titles-codex-0.144), so codex-acp can pick up the
# not-yet-pushed B1-B4 memories deliverables (codex-memories-extension, codex-memories-write,
# codex-state's clear_memory_data_in_sqlite_home, SessionSource::Cli wiring, etc.) that only
# exist on that local worktree so far.
#
# Cargo `[patch]` overrides are all-or-nothing *per source URL*: codex-core is a transitive
# dependency of nearly every other codex-* crate here, so if even one entry were left pointing at
# the old git branch while codex-memories-extension/codex-memories-write pull in codex-core from
# the local path, Cargo resolves two different sources for codex-core and fails with a "two
# sources" conflict. Hence every single codex-* entry — not just the two new memories crates —
# has to be switched to the same local path override together.
#
# TODO(agent-memory): once `drama/agent-memory-0.144` is pushed to
# https://github.com/drama-crew/codex and merged into (or replaces)
# `drama/summary-titles-codex-0.144`, revert every entry below back to
# `{ git = "https://github.com/drama-crew/codex", branch = "drama/summary-titles-codex-0.144" }`
# (or whatever the merged branch/tag ends up being) — do not leave this pointing at a local path
# in a long-lived branch.
codex-apply-patch = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/apply-patch" }
codex-arg0 = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/arg0" }
codex-config = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/config" }
codex-core = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/core" }
codex-exec-server = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/exec-server" }
codex-extension-api = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/ext/extension-api" }
codex-features = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/features" }
codex-home = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/codex-home" }
codex-http-client = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/http-client" }
codex-mcp-server = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/mcp-server" }
codex-memories-extension = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/ext/memories" }
codex-memories-write = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/memories/write" }
codex-models-manager = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/models-manager" }
codex-protocol = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/protocol" }
codex-login = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/login" }
codex-shell-command = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/shell-command" }
codex-state = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/state" }
codex-thread-store = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/thread-store" }
codex-utils-path-uri = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/utils/path-uri" }
codex-utils-approval-presets = { path = "/Users/feng/codes/s_codes/.worktrees/agent-memory/codex/codex-rs/utils/approval-presets" }
