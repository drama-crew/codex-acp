[package]
name = "codex-acp"
version = "0.16.0"
edition = "2024"
authors = ["Zed <hi@zed.dev>"]
license = "Apache-2.0"
description = "An ACP-compatible coding agent powered by Codex"
repository = "https://github.com/zed-industries/codex-acp"
homepage = "https://github.com/zed-industries/codex-acp"

[[bin]]
name = "codex-acp"
path = "src/main.rs"

[lib]
doctest = false
name = "codex_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.14.0", features = ["unstable"] }
anyhow = "1"
clap = "4"
codex-apply-patch = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-arg0 = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-config = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-core = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-exec-server = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-extension-api = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-features = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-home = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-http-client = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-mcp-server = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-memories-extension = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-memories-write = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-models-manager = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-login = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-shell-command = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-state = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-thread-store = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-utils-path-uri = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-utils-approval-presets = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
codex-utils-cli = { git = "https://github.com/openai/codex", tag = "rust-v0.144.3" }
# Pin allocative to match starlark 0.14.2's `^0.3.6` requirement (bumped from
# 0.3.4 during the rust-v0.144.3 dep bump; starlark_map's hashbrown internals
# need allocative's matching hashbrown implementation).
allocative = "=0.3.6"
diffy = { version = "0.5.0", features = ["std"] }
itertools = "0.14.0"
serde = { version = "1", features = ["derive"] }
# codex-cli depends on codex-tui, which enables serde_json/preserve_order; match
# that behavior here because it affects MCP keychain account hashing.
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
heck = "0.5.0"
unicode-segmentation = "1.11.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."https://github.com/openai/codex"]
# drama: Task B10 immutable fork pin (2026-07-24). Every codex-* crate below resolves to the
# pushed agent-memory revision, so Cargo has one source for codex-core and all B1-B4 memory
# deliverables without depending on a local worktree or a moving branch.
#
# Cargo `[patch]` overrides are all-or-nothing *per source URL*: codex-core is a transitive
# dependency of nearly every other codex-* crate here. Hence every single codex-* entry — not
# just the two new memories crates — is pinned to exactly the same immutable source revision.
codex-apply-patch = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-arg0 = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-config = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-core = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-exec-server = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-extension-api = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-features = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-home = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-http-client = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-mcp-server = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-memories-extension = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-memories-write = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-models-manager = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-protocol = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-login = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-shell-command = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-state = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-thread-store = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-utils-path-uri = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
codex-utils-approval-presets = { git = "https://github.com/drama-crew/codex", rev = "eb9584aa7b5095c4288d354a05d03ab3b1f0b0e9" }
